# Add these blocks to this site's virtual host configuration.
# Retain the existing SSL and ACME challenge configuration.
extprocessor xspann-next {
  type                    proxy
  address                 127.0.0.1:3100
  maxConns                100
  pcKeepAliveTimeout      60
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

context / {
  type                    proxy
  handler                 xspann-next
  addDefaultCharset       off
}

# Install on the vhost advertised by RELAY_PUBLIC_HOST. Match RELAY_SERVER_PORT.
websocket /app/ {
  address                 127.0.0.1:8081
}
